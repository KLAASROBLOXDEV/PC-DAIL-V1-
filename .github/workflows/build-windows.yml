name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: Publish v0.1.0-test after successful build
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Windows x64
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
      - name: Collect executables and smoke test
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/x86_64-pc-windows-msvc/release/pc-dial-v1.exe'
          $setup = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe')
          if (!(Test-Path $exe) -or $setup.Count -ne 1) { throw 'Expected application and one NSIS installer' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $exe artifacts/PC-Dial-V1-Test.exe
          Copy-Item $setup[0].FullName artifacts/PC-Dial-V1-Setup.exe
          $process = Start-Process -FilePath (Resolve-Path $exe) -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) { throw 'Application exited during smoke test' }
            if ($process.MainWindowHandle -eq 0) { throw 'Application did not create a desktop window' }
            Write-Output 'Desktop process remained running and created a window; interactions not tested.'
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
          Get-ChildItem artifacts/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content artifacts/SHA256SUMS.txt
          Copy-Item package-lock.json artifacts/
          Copy-Item src-tauri/Cargo.lock artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Dial-V1-Windows-x64
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_test_release)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PC-Dial-V1-Windows-x64
          path: artifacts
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-test' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $notes = @'
          PC Dial V1 Windows x64 test release.
          Includes a standalone executable and NSIS installer. Requires WebView2; setup installs it if needed.
          Simulation is fully available. Hardware integration is not configured because the firmware protocol is unknown.
          CI runs type checks, unit tests and a desktop process/window smoke test. Physical hardware and full UI interactions are not tested.
          Executables are unsigned.
          '@
          $notes | Set-Content release-notes.md
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:TARGET_SHA --title $env:RELEASE_TAG --prerelease --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG artifacts/PC-Dial-V1-Test.exe artifacts/PC-Dial-V1-Setup.exe artifacts/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }

