[package]
name = "pc-dial-v1"
version = "0.1.0-test"
description = "PC Dial V1 Windows test application"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

